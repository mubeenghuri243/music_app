{% extends 'base.html' %}
{% set active_nav = 'home' %}

{% block content %}
<div class="home-bg">
  <div class="topbar">
    <div class="avatar" style="width:38px;height:38px;background:linear-gradient(135deg,#ff6a1a,#ff9a5a);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;">👤</div>
    <button class="heart" id="heartBtn" onclick="toggleHeart()">♡</button>
  </div>

  <div class="greeting">
    <h2>Welcome! 👋</h2>
    <p>Tell us your preferences to get started</p>
  </div>

  <form action="{{ url_for('user_input') }}" method="POST">
    <div class="form-card">
      <div class="form-title">Your Preferences</div>
      <input class="finput" type="number" name="age" placeholder="Your Age  e.g. 22" required>
      <input class="finput" type="text" name="interests" placeholder="Interests  e.g. lofi, pop, jazz" required>
      <input class="finput" type="text" name="language" placeholder="Language  e.g. English, Urdu" required>
      <button type="submit" class="disc-btn">Discover My Music →</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleHeart() {
  const btn = document.getElementById('heartBtn');
  btn.classList.toggle('liked');
  btn.textContent = btn.classList.contains('liked') ? '♥' : '♡';
}
</script>
{% endblock %}
